name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate stack
        run: ruby scripts/validate-stack.rb
      - name: Test validator
        run: ruby scripts/validate-stack.test.rb
      - name: Test check runner
        run: node --test skills/jor-verify/scripts/run-checks.test.mjs
